# nginx reverse proxy, if you are not using Caddy.
#
# Assumes certificates from certbot. Unlike Caddy, nothing here is automatic:
# the HTTP->HTTPS redirect, the protocol floor and the forwarded headers all
# have to be stated explicitly, and each one is load-bearing.

# Rate limiting at the edge, in front of the application's own limiter. This
# one sheds load before it reaches Node; the app's is what enforces per-account
# policy. They are complementary, not redundant.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name resumeai.example.com;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name resumeai.example.com;

    ssl_certificate     /etc/letsencrypt/live/resumeai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumeai.example.com/privkey.pem;

    # TLS 1.2 is the floor; 1.0 and 1.1 are deprecated and broken.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    server_tokens off;

    # Matches MAX_FILE_MB (12) with headroom for multipart overhead. Too low
    # and large batches fail at the proxy with an opaque 413.
    client_max_body_size 20m;

    root /srv/resumeai/client/dist;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Auth endpoints get the tighter bucket.
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5174;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:5174;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # OCR on a large batch can take minutes.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: the data directory is outside the web root, so this
    # cannot match — but if someone later moves it, this refuses to serve it.
    location ~ ^/(data|uploads|\.env) { deny all; return 404; }

    access_log /var/log/nginx/resumeai.access.log;
    error_log  /var/log/nginx/resumeai.error.log warn;
}
